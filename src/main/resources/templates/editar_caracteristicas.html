<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Editar Característica</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Estilos -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: 250px;
            background-color: #f8f9fa;
            padding-top: 1rem;
            border-right: 1px solid #dee2e6;
        }

        .sidebar .nav-link {
            color: #333;
            padding: 10px 20px;
        }

        .sidebar .nav-link:hover {
            background-color: #e9ecef;
        }

        .main-content {
            flex-grow: 1;
            padding: 2rem;
        }
    </style>
</head>

<body>

    <!-- Menú lateral (fragmento) -->
    <div th:replace="menu :: sidebar"></div>

    <!-- Contenido principal -->
    <div class="main-content">
<div class="container mt-5">
    <h3>Editar Característica</h3>
    <form th:action="@{/admin/caracteristicas/actualizar}" th:object="${caracteristicaEditada}" method="post">
        <input type="hidden" th:field="*{id_caracteristica}">

        <div class="mb-3">
            <label class="form-label">ID Moto</label>
            <input type="number" class="form-control" th:field="*{id_moto}" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Descripción</label>
            <input type="text" class="form-control" th:field="*{descripcion}" required>
        </div>

        <button type="submit" class="btn btn-success">Actualizar</button>
        <a th:href="@{/admin/caracteristicas}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
