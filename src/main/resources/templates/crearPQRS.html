<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
  <meta charset="UTF-8" />
  <title>Crear PQRS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" th:href="@{/css/estilo_crearPQRS.css}" />
</head>

<body>

  <header class="header">
    <img th:src="@{/assets/LogoDylanMotosI.png}" alt="Dilan Motos" class="logo" />
    <div class="icons">
      <nav class="main-nav">
        <span class="money-icon">
          <img th:src="@{/assets/simboloPesos.png}" alt="Pesos" />
        </span>
        <div class="user-menu">
          <span id="userIcon" class="user-icon">
            <img th:src="@{/assets/iconoPerfil.png}" alt="Perfil" />
          </span>
          <ul id="dropdown" class="dropdown hidden">
            <li><a th:href="@{/CuentaUsuario}">Mi cuenta</a></li>
            <li><a th:href="@{/logout}">Cerrar sesión</a></li>
            <li sec:authorize="hasRole('ADMIN')"><a th:href="@{/admin/usuario}" class="dropdown-admin">Panel de
                Administración</a></li>
          </ul>
        </div>
      </nav>
    </div>
  </header>

  <div class="pqrs-container">
    <h2>Formulario PQRS</h2>

    <form th:action="@{/guardarPQRS}" th:object="${nuevoPqrs}" method="POST">

      <label for="nombre">Nombre completo</label>
      <input type="text" id="nombre" th:value="${usuario.nombre}" readonly="readonly" class="form-control mb-3" />

      <label for="correo">Correo electrónico</label>
      <input type="email" id="correo" th:value="${usuario.correo}" readonly="readonly" class="form-control mb-3" />

      <label for="tipo">Tipo de solicitud</label>
      <div class="Opciones-PQRS mb-3">
        <select id="tipo" th:field="*{tipo}" class="form-select" required="required">
          <option value="">Seleccione una opción</option>
          <option value="Peticion">Petición</option>
          <option value="Queja">Queja</option>
          <option value="Reclamo">Reclamo</option>
          <option value="Sugerencia">Sugerencia</option>
        </select>
      </div>

      <label for="mensaje">Mensaje</label>
      <textarea id="mensaje" th:field="*{mensaje}" class="form-control mb-3" required="required"></textarea>

      <button type="submit" class="btn btn-primary">Enviar</button>
    </form>
  </div>

  <div class="footer">
    <a th:href="@{/dashboard}" class="btn-accion">Inicio</a>
  </div>

  <script>
    document.getElementById("userIcon").addEventListener("click", function (e) {
      e.stopPropagation();
      document.getElementById("dropdown").classList.toggle("hidden");
    });

    window.addEventListener("click", function (e) {
      if (!document.querySelector(".user-menu").contains(e.target)) {
        document.getElementById("dropdown").classList.add("hidden");
      }
    });
  </script>

</body>

</html>
