<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error Inesperado | Dilan Motos</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f6f9; color: #333; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .error-card { background: white; padding: 40px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; max-width: 500px; border-top: 5px solid #6c757d; }
        h1 { font-size: 60px; margin: 0; color: #6c757d; }
        h2 { margin-top: 10px; font-size: 24px; }
        p { color: #6c757d; margin-bottom: 30px; line-height: 1.5; }
        .btn { display: inline-block; padding: 10px 25px; background-color: #343a40; color: white; text-decoration: none; border-radius: 5px; font-weight: bold; transition: background 0.3s; }
        .btn:hover { background-color: #23272b; }
    </style>
</head>
<body>
    <div class="error-card">
        <h1>Error</h1>
        <h2>Algo no salió como esperábamos</h2>
        <p>Ha ocurrido un error inesperado al procesar la información. Por favor, verifica tu conexión o intenta nuevamente más tarde.</p>
        <a th:href="@{/}" class="btn">Volver al inicio</a>
    </div>
</body>
</html>
