<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - No Encontrado | Dilan Motos</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f6f9; color: #333; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .error-card { background: white; padding: 40px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; max-width: 500px; border-top: 5px solid #0d6efd; }
        h1 { font-size: 80px; margin: 0; color: #0d6efd; }
        h2 { margin-top: 10px; font-size: 24px; }
        p { color: #6c757d; margin-bottom: 30px; line-height: 1.5; }
        .btn { display: inline-block; padding: 10px 25px; background-color: #0d6efd; color: white; text-decoration: none; border-radius: 5px; font-weight: bold; transition: background 0.3s; }
        .btn:hover { background-color: #0b5ed7; }
    </style>
</head>
<body>
    <div class="error-card">
        <h1>404</h1>
        <h2>¡Te saliste de la ruta!</h2>
        <p>Parece que el repuesto, registro o la página que estás buscando no existe en nuestro sistema o ha sido movido a otra ubicación.</p>
        <a th:href="@{/pqrs}" class="btn">Volver al inicio</a>
    </div>
</body>
</html>
